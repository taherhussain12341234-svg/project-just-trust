<script>if(/Android|iPhone|iPod|Mobi/i.test(navigator.userAgent)&&!/[?&]desktop/.test(location.search)){fetch("mobile.html",{method:"HEAD"}).then(function(r){if(r.ok)location.replace("mobile.html")}).catch(function(){})}</script><style>
:root{--fh:'Plus Jakarta Sans','Nunito Sans',system-ui,sans-serif;--fb:'Nunito Sans',system-ui,sans-serif;--sky:#3b9be0;--sky2:#7cc6f7;--sky3:#e3f3ff;--pink:#ff5fa2;--pink2:#ff8cc0;--pink3:#ffe7f1;--pinkd:#b02c6a;--ink:#0d2f55;--p:#36597f;--mute:#6584a3;--line:#d8e9f7;--card:#fff;--glass:#ffffffe0;--soft:#f5fafe;--t1:#fff3f8;--t1l:#ffd6e7;--t2:#edf7ff;--t2l:#c9e5fa;--bg1:#cdeaff;--bg2:#eff8ff;--bg3:#fff;--teal:#16a37f;--coral:#ff5c7a;--blue:#3b9be0;--chip:#eef6fd;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--pink3:#4d2b49;--pinkd:#ffb3d6;--sky3:#1d4f7e;--ink:#eaf6ff;--p:#c3dcf3;--mute:#93b6d6;--line:#2a5f92;--card:#14416b;--glass:#0f3560e0;--soft:#17476f;--t1:#43284a;--t1l:#6b3c66;--t2:#18466f;--t2l:#2c6798;--bg1:#0b2a4a;--bg2:#0d3258;--bg3:#0a2745;--chip:#1c4f7f}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:400 15px/1.6 var(--fb);color:var(--p);background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fh);color:var(--ink);margin:0;line-height:1.15;letter-spacing:-.01em}
.skyfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;fill:#fff;opacity:.6;animation:drift 60s ease-in-out infinite alternate}
.c1{width:190px;top:14%;left:-20px}.c2{width:130px;top:34%;right:6%;animation-duration:75s}.c3{width:230px;bottom:12%;left:34%;opacity:.4;animation-duration:80s}.c4{width:100px;top:9%;left:50%;animation-duration:65s}
@keyframes drift{to{transform:translateX(70px)}}
.app,header.top,main,.foot,nav#nav{position:relative;z-index:1}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 32px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;border:0;background:none;padding:0}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.02em}.brand small{display:block;font:600 11.5px var(--fb);color:var(--mute);margin-top:1px;letter-spacing:.02em}
.nv{font:700 14px var(--fh);color:var(--p);background:none;border:0;cursor:pointer}
.nv svg{width:22px;height:22px}
.xpp{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font:700 12px var(--fh);color:var(--ink);white-space:nowrap}
.xpp .t{width:64px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.xpp .t i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--pink2));transition:width .5s}
main{min-height:0;min-width:0}
section{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 1px 2px #0d2f5510,0 10px 28px #3b9be014;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.card h2{font-size:24px;margin-bottom:6px;font-weight:800}.card h3{font-size:17px;margin-bottom:6px;font-weight:700}.card p{margin:0 0 10px;color:var(--p)}
.label{align-self:flex-start;font:700 11px var(--fh);text-transform:uppercase;letter-spacing:.08em;color:var(--pinkd);background:var(--pink3);border-radius:7px;padding:4px 10px;margin-bottom:8px}
.label.a{color:#1b6ca8;background:var(--sky3)}.label.t{color:#13795c;background:#d9f6ec}
@media(prefers-color-scheme:dark){.label.a{color:#bfe6ff}.label.t{color:#9af0d2;background:#14503f}}
.btn{font:700 14px var(--fh);border:0;border-radius:12px;padding:12px 22px;background:linear-gradient(180deg,#ff78b1,#ff5a9f);color:#fff;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff55,0 6px 16px #ff5fa240;align-self:flex-start;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 #ffffff55,0 9px 20px #ff5fa255}
.btn.alt{background:linear-gradient(180deg,#5db8f6,#3b9be0);box-shadow:inset 0 1px 0 #ffffff55,0 6px 16px #3b9be040}
#prevp{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{font:700 13px var(--fh);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer;transition:border-color .15s}
.chip:hover{border-color:var(--sky)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(prefers-color-scheme:dark){.chip.on{background:var(--sky);border-color:var(--sky)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 12px}
.stat b{display:block;font:800 20px var(--fh);color:var(--ink);letter-spacing:-.02em}.stat span{display:block;font-size:12px;color:var(--mute);line-height:1.3}
.note{border-left:3px solid var(--pink);background:var(--t1);border-radius:0 10px 10px 0;padding:10px 14px;font-size:14px;color:var(--p)}
.note.b{border-color:var(--sky);background:var(--t2)}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:600 14px var(--fb);border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--sky);background:var(--t2)}
.opt i{font:700 12px var(--fh);font-style:normal;width:24px;height:24px;border-radius:7px;background:var(--chip);display:grid;place-items:center;flex:none}
.opt.right{border-color:var(--teal);background:#16a37f1f}.opt.right i{background:var(--teal);color:#fff}
.opt.wrong{border-color:var(--coral);background:#ff5c7a22;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.msg{min-height:22px;margin:8px 0 0;font-weight:700;font-size:14px}
input[type=range]{width:100%;accent-color:var(--pink);margin:4px 0 8px}
.big{font:800 34px var(--fh);line-height:1;color:var(--ink);letter-spacing:-.02em}
.meter{height:10px;background:var(--chip);border-radius:9px;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;width:0;background:var(--teal);border-radius:9px;transition:width .25s,background .25s}
.count{font:700 12px var(--fh);background:var(--pink3);color:var(--pinkd);border-radius:8px;padding:4px 12px;align-self:flex-start}
.coord{font:700 11px var(--fh);letter-spacing:.06em;text-transform:uppercase;color:var(--pinkd);margin-bottom:2px}
.pc{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:99;animation:fl 1s ease-out forwards}
@keyframes fl{to{transform:translate(var(--x),var(--y));opacity:0}}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.cr{margin:0;padding-left:18px;color:var(--p);font-size:12.5px}.cr li{margin-bottom:5px}.cr a{color:#1b78c2;word-break:break-word}
/* home */
.hero{display:grid;grid-template-columns:1.02fr 1fr;gap:36px;align-items:center;flex:1;min-height:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 12px var(--fh);letter-spacing:.06em;text-transform:uppercase;color:var(--pinkd);margin-bottom:14px}
.eyebrow::before{content:'';width:22px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--pink),var(--pink2))}
.hero h1{font-size:52px;font-weight:800;letter-spacing:-.035em;line-height:1.04}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--pink),var(--pink2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{font-size:17px;max-width:500px;margin:16px 0 24px;color:var(--p)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:22px;margin-top:26px}.trust div+div{border-left:1px solid var(--line);padding-left:22px}
.trust b{display:block;font:800 26px var(--fh);color:var(--ink);letter-spacing:-.02em}.trust span{font-size:12px;color:var(--mute)}
.hero-art{position:relative;display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:1fr 1fr;gap:14px;height:100%;min-height:290px;max-height:380px;align-self:center}
.hero-art::before{content:'';position:absolute;inset:-6% -4%;border-radius:40%;background:radial-gradient(circle at 40% 35%,#ffffffcc,#bfe6ff55 55%,transparent 72%);z-index:0}
.ph{position:relative;z-index:1;margin:0;border:3px solid #fff;border-radius:16px;overflow:hidden;box-shadow:0 14px 34px #1f7fc933;background:#0f3a63;min-height:0}
.ph::before{content:'';position:absolute;inset:-20px;background:var(--bgimg) center/cover;filter:blur(22px) saturate(1.2) brightness(.72)}
.ph img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block}
.ph span{position:absolute;z-index:2;left:8px;bottom:8px;font:700 11px var(--fh);letter-spacing:.03em;color:#fff;background:linear-gradient(180deg,#ff78b1,#ff5a9f);border-radius:7px;padding:3px 9px}
.ph1{grid-row:span 2}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;flex:none}
.feat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:0 1px 2px #0d2f5510,0 8px 20px #3b9be012;transition:transform .15s,border-color .15s}
.feat:hover{transform:translateY(-3px);border-color:var(--pink2)}
.feat b{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(180deg,#ff78b1,#ff5a9f);box-shadow:0 6px 14px #ff5fa240;margin-bottom:10px}.feat b svg{width:20px;height:20px}
.feat h3{font-size:15px;margin-bottom:2px}.feat p{margin:0;font-size:13px;color:var(--mute)}
.dyk{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;flex:none}
.dyk b{color:var(--pinkd);font:700 11px var(--fh);text-transform:uppercase;letter-spacing:.09em;white-space:nowrap}
/* craft files */
.pick{display:flex;gap:10px;flex:none}
.pk{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;cursor:pointer;color:var(--ink);font:700 14px var(--fh);text-align:left;box-shadow:0 1px 2px #0d2f5510}
.pk img{width:44px;height:44px;border-radius:9px;object-fit:contain;background:#0f3a63;flex:none}.pk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk.on{border-color:var(--pink);background:var(--t1);box-shadow:0 6px 16px #ff5fa230}
.pk .ck{margin-left:auto;color:var(--teal);font:800 16px var(--fh)}
.book{flex:1;min-height:0;gap:10px}
.bk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.bk-head h2{margin:0}.bk-head .label{margin-bottom:6px}
.bk-body{flex:1;min-height:0}.bk-foot{display:flex;justify-content:space-between;flex:none}
.p1{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;height:100%;min-height:0}
.art2{position:relative;margin:0;border-radius:14px;background:#0f3a63;border:3px solid var(--card);box-shadow:0 10px 26px #3b9be033;overflow:hidden;min-height:0;display:flex}
.art2::before{content:'';position:absolute;inset:-24px;background:var(--bgimg) center/cover;filter:blur(26px) saturate(1.2) brightness(.72)}
.art2 img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block}
.pcap{position:absolute;z-index:2;right:8px;bottom:8px;font:700 11px var(--fh);letter-spacing:.03em;color:#fff;background:linear-gradient(180deg,#ff78b1,#ff5a9f);border-radius:7px;padding:3px 10px}
.info{min-height:0;display:flex;flex-direction:column}.info h4,.blk h4{margin:8px 0 4px;font:700 11px var(--fh);letter-spacing:.09em;text-transform:uppercase;color:var(--pinkd)}.blk h4{margin-top:0}
.lead{font-size:14px;margin:0 0 8px;color:var(--p)}
.ff{margin:0;padding-left:18px;font-size:13.5px;color:var(--p)}.ff li{margin-bottom:2px}.ff li::marker{color:var(--pink)}
.p2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;height:100%;min-height:0}
.col2{display:grid;grid-template-rows:1fr 1fr;gap:14px;min-height:0}
.blk{border:1px solid var(--t1l);border-radius:12px;padding:14px 16px;background:var(--t1);min-height:0;display:flex;flex-direction:column}
.blk.g{background:var(--t2);border-color:var(--t2l)}.blk.b{background:var(--card);border-color:var(--line)}.blk.g h4{color:#1b78c2}
.blk p{margin:0;font-size:14.5px;color:var(--p)}.stp{margin:0 0 12px;padding-left:20px;font-size:14.5px;color:var(--p)}.stp li{margin-bottom:8px}.stp li::marker{color:var(--pink);font-weight:700}.blk .btn{margin-top:auto}
.p3{display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
.gbox{flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft);overflow:hidden;display:flex;flex-direction:column;gap:4px}
.gbox h2{font-size:22px}.gbox h3{font-size:17px;margin-bottom:2px}.gbox p{font-size:13px;margin:0 0 4px}.gbox .opts{margin-top:4px;gap:6px}.gbox .opt{padding:6px 10px;font-size:13px}.gbox .msg{margin:4px 0 0;min-height:20px}.gbox .btn{align-self:flex-start}
.gbox .opts.two{grid-template-columns:1fr 1fr}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}.mt>div{display:grid;gap:5px;align-content:start}.opt.right[disabled]{opacity:1}
.cvw{display:flex;justify-content:center}#cv{width:min(100%,540px);height:auto;border-radius:12px;touch-action:manipulation;background:#05071a}
/* page stepper */
.steps3{display:flex;align-items:center;gap:6px}
.st{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 16px 7px 8px;cursor:pointer;font:700 14px var(--fh);color:var(--ink);text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s;box-shadow:0 1px 2px #0d2f5510}
.st b{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--chip);color:var(--ink);font:800 14px var(--fh);flex:none}
.st span{display:flex;flex-direction:column;line-height:1.15}.st small{font:600 11px var(--fb);color:var(--mute)}
.st:hover{transform:translateY(-2px);border-color:var(--pink2)}
.st.on{background:linear-gradient(180deg,#ff78b1,#ff5a9f);border-color:transparent;color:#fff;box-shadow:inset 0 1px 0 #ffffff55,0 8px 20px #ff5fa24d}
.st.on b{background:#fff;color:var(--pinkd)}.st.on small{color:#fff}
.st.dn:not(.on) b{background:var(--teal);color:#fff;font-size:0}.st.dn:not(.on) b::after{content:'✓';font-size:15px}
.ln{display:block;width:24px;height:3px;border-radius:3px;background:var(--line);flex:none;position:relative;overflow:hidden}
.ln::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--pink),var(--pink2));transform:scaleX(0);transform-origin:left;transition:transform .35s}.ln.fl::after{transform:scaleX(1)}
.tease{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:700 14px var(--fh);color:var(--pinkd);background:var(--t1);border:1px dashed var(--pink2);border-radius:12px;padding:7px 14px;cursor:pointer}
.tease span{font-size:20px;transition:transform .2s}.tease:hover span{transform:translateX(5px)}.tease:hover{background:var(--pink3)}
.inR{animation:inR .35s ease both}.inL{animation:inL .35s ease both}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
#nextp{animation:nudge 2.6s ease-in-out infinite}@keyframes nudge{0%,100%{box-shadow:inset 0 1px 0 #ffffff55,0 6px 16px #ff5fa240}50%{box-shadow:inset 0 1px 0 #ffffff55,0 0 0 7px #ff5fa224,0 6px 16px #ff5fa240}}
.swipe{display:none}
/* map */
.mapwrap{position:relative;border-radius:14px;overflow:hidden;background:#12466f;box-shadow:0 10px 30px #3b9be033;border:3px solid var(--card);min-height:0}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#svg path,#svg line,#svg circle{vector-effect:non-scaling-stroke}
.bg0{fill:#1b5886}.mare{fill:#0f3f69;stroke:#8fd3ff;stroke-opacity:.45;stroke-width:1.2px}
.ct{fill:none;stroke:#bfe6ff;stroke-opacity:.45;stroke-width:1px}.ct.hi{stroke:#fff;stroke-opacity:.8;stroke-width:1.6px}
.crt{fill:#0c3558;stroke:#bfe6ff;stroke-opacity:.55;stroke-width:1px}.rille{fill:none;stroke:#ff9ccb;stroke-opacity:.95;stroke-width:1.8px;stroke-dasharray:4 3}
.gl{stroke:#fff;stroke-opacity:.22;stroke-width:.8px;stroke-dasharray:3 3;fill:none}
.tk{font:700 var(--fs,11px) 'Plus Jakarta Sans',system-ui,sans-serif;fill:#e4f4ff;opacity:.95}
.rl{font:700 calc(var(--fs,11px)*1.1) 'Plus Jakarta Sans',system-ui,sans-serif;fill:#cfeaff;opacity:.7;letter-spacing:.18em}
.pin{cursor:pointer}.pr{fill:var(--pink);stroke:#fff;stroke-width:2px}.pc2{fill:none;stroke:var(--pink2);stroke-opacity:.7;stroke-width:2px;animation:pu 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{from{transform:scale(1)}to{transform:scale(2.1);opacity:0}}
.pin.t-rover .pr{fill:#ffd166}.pin.t-depot .pr{fill:#7be0c3}.pin.seen .pc2{display:none}.pin.on .pr{fill:#fff;stroke:var(--pink)}
.pn{font:800 13px 'Plus Jakarta Sans',system-ui,sans-serif;fill:#3a1030;pointer-events:none}
.pl rect{fill:#fff;fill-opacity:.96;stroke:#cfe7f8}.pl text{font:700 12px 'Plus Jakarta Sans',system-ui,sans-serif;fill:#0d2f55;pointer-events:none}
.hud{position:absolute;z-index:3;font:700 12px var(--fh);color:#0d2f55;background:#ffffffe8;backdrop-filter:blur(6px);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:8px}
.hud.tl{left:12px;top:12px}.hud.tr{right:12px;top:12px;flex-direction:column;padding:6px 9px;gap:0;pointer-events:none}
.hud.bl{left:12px;bottom:12px;padding:4px;gap:4px}.hud.br{right:12px;bottom:12px;flex-direction:column;align-items:flex-end;gap:3px}
.hud b{color:var(--pinkd)}.hud button{font:700 12px var(--fh);color:#0d2f55;background:var(--sky3);border:0;border-radius:8px;min-width:34px;height:34px;padding:0 10px;cursor:pointer}
.fl{position:absolute;z-index:3;left:12px;right:12px;top:52px;display:flex;gap:6px;flex-wrap:wrap}
.fl button{font:700 11px var(--fh);color:#0d2f55;background:#ffffffe8;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
.fl button.on{background:linear-gradient(180deg,#ff78b1,#ff5a9f);color:#fff}
.sb{height:5px;border:2px solid #0d2f55;border-top:0;display:block}.ro{font-variant-numeric:tabular-nums}
.rhead{display:flex;gap:12px;align-items:center;margin-bottom:8px}.relf .note{font-size:13.5px;line-height:1.45;padding:8px 12px}.rhead img{width:62px;height:62px;border-radius:10px;object-fit:contain;background:#0f3a63;flex:none}.rhead h3{margin:0;font-size:19px}
.lnk{font:700 12px var(--fh);color:#1b78c2;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
/* 3D lab */
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
